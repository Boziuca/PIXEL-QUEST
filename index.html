<!doctype html>
<html lang="ro" data-theme="dark" data-palette="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="description" content="Agenda ta personală, sub forma unui joc RPG pixel-art.">
  <title>PixelQuest – Agenda eroului</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bara de sus: nivel, XP, monede, sunet -->
  <header id="topbar" class="topbar" hidden>
    <button class="hud-hero" id="hud-hero" aria-label="Profil"></button>
    <div class="hud-main">
      <div class="hud-row">
        <span class="hud-level" id="hud-level">NIV 1</span>
        <span class="hud-streak" id="hud-streak"></span>
        <span class="hud-coins" id="hud-coins"></span>
      </div>
      <div class="bar bar-xp" id="hud-xp"><div class="bar-fill"></div><span class="bar-label"></span></div>
    </div>
    <button class="icon-btn" id="hud-sound" aria-label="Sunet"></button>
  </header>

  <main id="view" class="view"></main>

  <!-- Navigarea de jos -->
  <nav id="bottomnav" class="bottomnav" hidden>
    <a href="#/harta" data-nav="harta"><span class="ni" data-icon="map"></span><span>Hartă</span></a>
    <a href="#/azi" data-nav="azi"><span class="ni" data-icon="sword"></span><span>Azi</span></a>
    <a href="#/calendar" data-nav="calendar"><span class="ni" data-icon="calendar"></span><span>Calendar</span></a>
    <a href="#/statistici" data-nav="statistici"><span class="ni" data-icon="chart"></span><span>Statistici</span></a>
    <a href="#/profil" data-nav="profil"><span class="ni" data-icon="gear"></span><span>Profil</span></a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
